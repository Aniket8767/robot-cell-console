# One origin (http://localhost:8080) for everything.
#   /          React app (+ /vue-panel/pick-panel.js, /robot/urdf/ur5e.urdf)
#   /ws        -> rosbridge websocket   backend:9090   (port from config/cell.yaml)
#   /api/      -> camera + config HTTP  backend:8081   (port from config/cell.yaml)
#
# Docker's DNS (127.0.0.11) + a variable in proxy_pass make nginx re-resolve "backend"
# at request time, so it keeps working after the backend container is restarted.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /ws {
        set $rosbridge http://backend:9090;
        rewrite ^/ws$ / break;
        proxy_pass $rosbridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $api http://backend:8081;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
